[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ni-lfm"
version = "0.1.0"
description = "NI-LFM: NASA-IBM Lunar Foundation Model — pretraining, finetuning and inference release"
requires-python = ">=3.11,<3.13"
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["dependencies"]

[project.optional-dependencies]
# Experiment tracking. The shipped configs log to TensorBoard so they run with
# no account; install this extra to switch a run over to Weights & Biases.
wandb = ["wandb>=0.17"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["ni_lfm*", "terratorch_integration*"]

[tool.setuptools.package-data]
# The finetuning recipes and the trained text tokenizer are data, not code, so
# they have to be declared here or they vanish from an installed wheel.
terratorch_integration = ["configs/**/*.yaml"]
ni_lfm = [
    "utils/tokenizer/*.txt",
    "utils/tokenizer/trained/*",
]

[tool.uv]
# Build the project itself as an editable install so edits to configs and
# custom modules take effect without reinstalling.
package = true
