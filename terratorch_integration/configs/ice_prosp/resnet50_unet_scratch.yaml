# Ice-prospectivity regression (PROSP)
# Backbone: timm ResNet-50, randomly initialized (no pretraining)
#
# All modalities, stacked into one 9-channel tensor
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/ice_prosp/resnet50_unet_scratch.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp
      name: resnet50_unet_scratch
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/ice_prosp/checkpoints/resnet50_unet_scratch
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root: data/prospectivity_dataset
    train_label_data_root: data/prospectivity_dataset
    val_data_root: data/prospectivity_dataset
    val_label_data_root: data/prospectivity_dataset
    test_data_root: data/prospectivity_dataset
    test_label_data_root: data/prospectivity_dataset
    predict_data_root: data/prospectivity_dataset
    train_split: data/prospectivity_dataset/train_filtered.txt
    val_split: data/prospectivity_dataset/val_filtered.txt
    test_split: data/prospectivity_dataset/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    concat_bands: true
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: timm_resnet50.a1_in1k
      backbone_pretrained: false
      backbone_in_chans: 9          # 8 modalities; aspect is ASP_SIN_COS (2 bands)
      backbone_out_indices: [0, 1, 2, 3]
      necks:
        - name: SelectIndices
          indices: [0, 1, 2, 3]
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      head_dropout: 0.1
      # No num_classes: this is regression, and EncoderDecoderFactory builds a
      # RegressionHead whose __init__ rejects it.

    # Flat CNN recipe — layer_decay MUST stay 1.0. The LLRD matcher keys off
    # `.blocks.`, which timm CNNs never emit, so any other value would claim
    # LLRD while applying none.
    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1
    backbone_lr: 3.0e-4
    head_lr: 3.0e-4
    layer_decay: 1.0
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 130
    eta_min: 1.0e-6
