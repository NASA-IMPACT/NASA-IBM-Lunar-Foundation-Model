# Ice-prospectivity regression (PROSP)
# Backbone: NASA-IBM Lunar Foundation Model at patch size 8 
#
# All modalities
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/ice_prosp/ni_lfm_ps8.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  deterministic: true
  benchmark: false
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp
      name: ni_lfm_ps8
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: terratorch_integration.DeterministicAugmentation
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/ice_prosp/checkpoints/ni_lfm_ps8
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: "regression"
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root: data/prospectivity_dataset
    train_label_data_root: data/prospectivity_dataset
    val_data_root: data/prospectivity_dataset
    val_label_data_root: data/prospectivity_dataset
    test_data_root: data/prospectivity_dataset
    test_label_data_root: data/prospectivity_dataset
    predict_data_root: data/prospectivity_dataset
    train_split: data/prospectivity_dataset/train_filtered.txt
    val_split: data/prospectivity_dataset/val_filtered.txt
    test_split: data/prospectivity_dataset/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: ni_lfm_v1_base
      backbone_checkpoint_path: backbone/checkpoint.pt
      backbone_cfg: backbone/config.yaml

      backbone_patch_size: 8
      backbone_modalities:
        - aspect
        - CUR
        - DICE
        - LPSR
        - LPSR_DEN
        - LPSR_DIS
        - slope
        - TMAX
      backbone_new_modalities:
        CUR:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            CUR: {gsd_m: 100.0}
        DICE:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            DICE: {gsd_m: 100.0}
        LPSR:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR: {gsd_m: 100.0}
        LPSR_DEN:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR_DEN: {gsd_m: 100.0}
        LPSR_DIS:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR_DIS: {gsd_m: 100.0}
        TMAX:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            TMAX: {gsd_m: 100.0}
      backbone_merge_method: concat
      backbone_seed_new_modality_from:
        CUR: slope
        DICE: slope
        LPSR: slope
        LPSR_DEN: slope
        LPSR_DIS: slope
        TMAX: slope
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck
          out_channel: 256
          output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size: [256, 256]

    freeze_backbone: false
    freeze_decoder: false
    loss: huber
    ignore_index: -1

    backbone_lr: 3.0e-4
    head_lr: 3.0e-4
    layer_decay: 0.85
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.98]
    warmup_steps: 130       
    eta_min: 1.0e-6
