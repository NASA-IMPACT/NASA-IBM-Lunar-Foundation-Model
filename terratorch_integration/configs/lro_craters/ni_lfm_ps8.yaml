# Lunar Crater Detection (LRO grayscale)
# Backbone: NASA-IBM Lunar Foundation Model at patch size 8 (pretrained weights)
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/lro_craters/ni_lfm_ps8.yaml

seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/lro-crater
      name: ni_lfm_ps8
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/lro-crater/checkpoints/ni_lfm_ps8
        monitor: val_bbox_map
        mode: max
        filename: best-{epoch:02d}-{val_bbox_map:.3f}
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: <dataset_root>/LRO_craters
    batch_size: 4
    num_workers: 4
    image_size: 512
    output_mode: vis
    replicate_bands: 5
    norm_mean: 0.251561
    norm_std: 0.121082
    load_masks: true
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image, vis]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: mask-rcnn
      backbone: ni_lfm_v1_base
      backbone_checkpoint_path: backbone/checkpoint.pt
      backbone_cfg: backbone/config.yaml
      num_classes: 2
      framework_min_size: 512
      framework_max_size: 512

      backbone_modalities:
        - vis

      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      backbone_drop_path_rate_encoder: 0.1

      in_channels: 5
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 64
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]

    backbone_lr: 5.0e-5
    head_lr: 5.0e-5
    layer_decay: 0.65
    weight_decay: 0.05
    head_weight_decay: 1.0e-3
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6
