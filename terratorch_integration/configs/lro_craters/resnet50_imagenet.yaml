# Lunar Crater Detection (LRO grayscale)
# Backbone: ImageNet-pretrained ResNet-50 via timm
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/lro_craters/resnet50_imagenet.yaml

seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/lro-crater
      name: resnet50_imagenet
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/lro-crater/checkpoints/resnet50_imagenet
        monitor: val_bbox_map
        mode: max
        filename: best-{epoch:02d}-{val_bbox_map:.3f}
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: <dataset_root>/LRO_craters
    batch_size: 4
    num_workers: 4
    image_size: 512
    output_mode: image
    norm_mean: 0.251561
    norm_std: 0.121082
    load_masks: true
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: mask-rcnn
      backbone: timm_resnet50        # ImageNet-pretrained

      backbone_pretrained: true
      backbone_in_chans: 1
      backbone_features_only: true
      backbone_out_indices: [1, 2, 3, 4]

      num_classes: 2
      framework_min_size: 512
      framework_max_size: 512

      in_channels: 1

      necks:
        - name: SelectIndices
          indices: [0, 1, 2, 3]
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 1.0e-4
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 0