# Lunar IMP Semantic Segmentation (IMP)
# Backbone: ResNet-34 (SMP U-Net), randomly initialized (no pretraining)
#
# Requires: pip install segmentation-models-pytorch
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/imp/unet_resnet34_scratch.yaml

seed_everything: 23
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  gradient_clip_val: 1.0
  deterministic: true
  benchmark: false
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/imp
      name: unet_resnet34_scratch
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: terratorch_integration.DeterministicAugmentation
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/imp/checkpoints/unet_resnet34_scratch
        monitor: val/F1_Score
        mode: max
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false
data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 1
    rgb_indices:
      - 0
      - 0
      - 0
    train_data_root: data/imp_dataset/all
    train_label_data_root: data/imp_dataset/all
    val_data_root: data/imp_dataset/all
    val_label_data_root: data/imp_dataset/all
    test_data_root: data/imp_dataset/all
    test_label_data_root: data/imp_dataset/all
    predict_data_root: data/imp_dataset/all
    train_split: data/imp_dataset/train.txt
    val_split: data/imp_dataset/val.txt
    test_split: data/imp_dataset/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      - 0.029947
    stds:
      - 0.016554
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  # Stock TerraTorch task, not terratorch_integration.LunarSegmentationTask:
  # SMPModelFactory returns an SMPModelWrapper that owns encoder+decoder as one
  # unit and exposes no `.encoder`, which the LLRD mixin dereferences. These are
  # flat-LR baselines (layer_decay would be 1.0 anyway), so no LLRD is lost.
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    lr: 1.0e-4
    optimizer: AdamW
    optimizer_hparams:
      weight_decay: 1.0e-4
    model_factory: SMPModelFactory
    model_args:
      model: Unet
      backbone: resnet34
      pretrained: false
      bands: [0]
      in_channels: 1
      num_classes: 2

    # No aux_loss: SMP builds encoder+decoder as one unit with no aux head.
    loss: dice
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 10
