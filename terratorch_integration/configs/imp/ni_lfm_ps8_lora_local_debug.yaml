# Lunar IMP Semantic Segmentation (IMP)
# Backbone: NASA-IBM Lunar Foundation Model at patch size 8 (LoRA PEFT variant)
#
# Requires: pip install terratorch[peft]
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/imp/ni_lfm_ps8_lora.yaml


seed_everything: 23
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  gradient_clip_val: 1.0

  deterministic: true
  benchmark: false
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/imp
      name: ni_lfm_ps8_lora
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: terratorch_integration.DeterministicAugmentation
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/imp/checkpoints/ni_lfm_ps8_lora
        monitor: val/F1_Score
        mode: max
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false
data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 1
    rgb_indices:
      - 0
      - 0
      - 0
    train_data_root: debug_data/IMP_dataset/all
    train_label_data_root: debug_data/IMP_dataset/all
    val_data_root: debug_data/IMP_dataset/all
    val_label_data_root: debug_data/IMP_dataset/all
    test_data_root: debug_data/IMP_dataset/all
    test_label_data_root: debug_data/IMP_dataset/all
    predict_data_root: debug_data/IMP_dataset/all
    train_split: debug_data/IMP_dataset/splits/train.txt
    val_split: debug_data/IMP_dataset/splits/val.txt
    test_split: debug_data/IMP_dataset/splits/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      - 0.029947
    stds:
      - 0.016554
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarSegmentationTask
  init_args:
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 0.0
    head_weight_decay: 1.0e-3
    warmup_steps: 200
    eta_min: 1.0e-6
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: ni_lfm_v1_base
      backbone_checkpoint_path: debug_data/backbone/checkpoint.pt
      backbone_cfg: debug_data/backbone/config.yaml
      backbone_remove_register_tokens: false
      backbone_modalities:
        - nac
      backbone_patch_size: 16
      backbone_drop_path_rate_encoder: 0.1
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      head_dropout: 0.1
      num_classes: 2

      peft_config:
        method: LORA
        peft_config_kwargs:
          r: 16
          lora_alpha: 32
          lora_dropout: 0.05
          bias: none
          target_modules:
            - qkv
            - mlp.fc1
            - mlp.fc2
            - mlp.fc3
          exclude_modules: '.*decoder\..*'

    loss: dice
    aux_loss:
      aux_head: 1.0
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 10
