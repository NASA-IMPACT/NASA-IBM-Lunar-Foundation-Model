# Lunar IMP Semantic Segmentation (IMP)
# Backbone: NASA-IBM Lunar Foundation Model at patch size 8, randomly initialized (no pretraining), encoder frozen
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/imp/ni_lfm_ps8_frozen_random_init.yaml

seed_everything: 23
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  gradient_clip_val: 1.0

  deterministic: true
  benchmark: false
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/imp
      name: ni_lfm_ps8_frozen_random_init
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: terratorch_integration.DeterministicAugmentation
    - class_path: terratorch_integration.DeterministicLoss
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/imp/checkpoints/ni_lfm_ps8_frozen_random_init
        monitor: val/F1_Score
        mode: max
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false
data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 32
    num_workers: 1
    rgb_indices:
      - 0
      - 0
      - 0
    train_data_root: data/imp_dataset/all
    train_label_data_root: data/imp_dataset/all
    val_data_root: data/imp_dataset/all
    val_label_data_root: data/imp_dataset/all
    test_data_root: data/imp_dataset/all
    test_label_data_root: data/imp_dataset/all
    predict_data_root: data/imp_dataset/all
    train_split: data/imp_dataset/train.txt
    val_split: data/imp_dataset/val.txt
    test_split: data/imp_dataset/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      - 0.027375
    stds:
      - 0.014783
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2


model:
  class_path: terratorch_integration.LunarSegmentationTask
  init_args:
    backbone_lr: 3.0e-4
    head_lr: 1.0e-3
    layer_decay: 1.0
    weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 200
    eta_min: 1.0e-6
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: ni_lfm_v1_base
      backbone_cfg: backbone/config.yaml
      backbone_remove_register_tokens: false
      backbone_modalities:
        - nac
      backbone_patch_size: 8
      backbone_drop_path_rate_encoder: 0.1
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 512
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      head_dropout: 0.0
      num_classes: 2
    loss:
      dice: 1.0
      ce: 0.25
      lovasz: 0.5
    class_weights: [0.1, 0.9]
    freeze_backbone: true
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 5
